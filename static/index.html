<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cyberstory - YouTube 知识与历史检索</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f8fafc;
            color: #1e293b;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ─── 最左侧主导航栏 (Global Sidebar) ─── */
        .global-sidebar {
            width: 220px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .brand {
            padding: 20px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #f1f5f9;
        }
        .brand-logo {
            width: 32px;
            height: 32px;
            background: #ef4444;
            color: #fff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
        }
        .brand-text h1 { font-size: 15px; font-weight: 700; color: #0f172a; }
        .brand-text p { font-size: 11px; color: #64748b; }

        .nav-tabs {
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        .nav-tab {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s;
        }
        .nav-tab:hover { background: #f1f5f9; color: #0f172a; }
        .nav-tab.active { background: #eff6ff; color: #2563eb; }
        .nav-tab .badge {
            margin-left: auto;
            background: #e2e8f0;
            color: #475569;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 12px;
            font-weight: 500;
        }
        .nav-tab.active .badge { background: #bfdbfe; color: #1d4ed8; }

        .nav-tab.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .service-status {
            padding: 16px;
            border-top: 1px solid #f1f5f9;
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
        }

        /* ─── 主体工作区 (三列并排布局：A区 | B区 | C区) ─── */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            background: #f8fafc;
        }

        /* ─── A区：历史记录列表 (Date-Grouped Feed) ─── */
        .pane-history {
            width: 380px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .pane-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .pane-header h2 { font-size: 15px; font-weight: 700; color: #0f172a; }
        .pane-header .header-meta { font-size: 12px; color: #64748b; }

        .history-feed {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .date-group {
            margin-bottom: 24px;
        }
        .date-title {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
            padding-bottom: 8px;
            margin-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .date-title span { font-size: 11px; font-weight: 400; color: #94a3b8; }

        .history-card {
            display: flex;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #f1f5f9;
            margin-bottom: 10px;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s;
        }
        .history-card:hover {
            border-color: #cbd5e1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .history-card.active {
            border-color: #3b82f6;
            background: #f8faff;
        }
        .thumb-box {
            position: relative;
            width: 100px;
            height: 56px;
            border-radius: 6px;
            overflow: hidden;
            background: #e2e8f0;
            flex-shrink: 0;
        }
        .thumb-box img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .thumb-duration {
            position: absolute;
            bottom: 4px; right: 4px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 600;
        }
        .card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }
        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: #1e293b;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-channel {
            font-size: 11px;
            color: #64748b;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-badges {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .badge-tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .tag-native { background: #dcfce7; color: #15803d; }
        .tag-asr { background: #dbeafe; color: #1d4ed8; }
        .tag-processing { background: #fef3c7; color: #b45366; }
        .tag-pending { background: #f1f5f9; color: #64748b; }
        .tag-failed { background: #fee2e2; color: #b91c1c; }

        .progress-block {
            margin-top: 6px;
            font-size: 10px;
            color: #b45366;
            background: #fffbeb;
            padding: 4px 6px;
            border-radius: 4px;
            border: 1px solid #fde68a;
        }
        .progress-bar-bg {
            height: 4px;
            background: #fde68a;
            border-radius: 2px;
            margin-top: 3px;
            overflow: hidden;
        }
        .progress-bar-val {
            height: 100%;
            background: #d97706;
            border-radius: 2px;
            transition: width 0.3s;
        }

        /* ─── B区：搜索与检索卡片列表 (Search Stream) ─── */
        .pane-search {
            flex: 1.2;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            min-width: 420px;
        }
        .search-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
        }
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-icon {
            position: absolute;
            left: 14px;
            font-size: 15px;
            color: #94a3b8;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .search-meta {
            margin-top: 8px;
            font-size: 12px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
        }

        .search-results {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .result-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
            background: #fff;
            transition: all 0.15s;
        }
        .result-card:hover {
            border-color: #93c5fd;
            box-shadow: 0 4px 12px rgba(37,99,235,0.06);
        }
        .result-card.active-result {
            border-color: #2563eb;
            background: #f8faff;
        }
        .result-top {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }
        .result-top .thumb-box {
            width: 110px;
            height: 62px;
        }
        .result-detail {
            flex: 1;
            min-width: 0;
        }
        .result-title {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.4;
        }
        .result-meta {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
            display: flex;
            gap: 10px;
        }

        .snippet-box {
            background: #f8fafc;
            border-left: 3px solid #2563eb;
            padding: 8px 12px;
            border-radius: 0 6px 6px 0;
            margin-top: 8px;
            font-size: 12px;
            color: #334155;
            line-height: 1.5;
        }
        .snippet-box mark {
            background: #fef08a;
            color: #854d0e;
            font-weight: 600;
            padding: 1px 3px;
            border-radius: 3px;
        }
        .result-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #f1f5f9;
        }
        .time-jump-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
            color: #2563eb;
            background: #eff6ff;
            padding: 4px 8px;
            border-radius: 4px;
            text-decoration: none;
        }
        .time-jump-btn:hover { background: #dbeafe; }
        .view-detail-btn {
            font-size: 12px;
            color: #64748b;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .view-detail-btn:hover { color: #0f172a; text-decoration: underline; }

        /* ─── C区：详情与字幕时间轴列表 (Detail Timeline) ─── */
        .pane-detail {
            width: 440px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .detail-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
        }
        .detail-title {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .detail-meta-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 11px;
            color: #64748b;
        }
        .sub-filter-box {
            padding: 10px 20px;
            border-bottom: 1px solid #f1f5f9;
            background: #f8fafc;
        }
        .sub-filter-input {
            width: 100%;
            padding: 6px 12px;
            font-size: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
        }
        .sub-filter-input:focus { border-color: #2563eb; }

        .timeline-stream {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }
        .timeline-row {
            display: flex;
            gap: 12px;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            transition: background 0.15s;
        }
        .timeline-row:hover { background: #f1f5f9; }
        .timeline-row.highlighted { background: #fef9c3; }
        .time-badge {
            font-family: monospace;
            font-size: 11px;
            font-weight: 700;
            color: #2563eb;
            background: #eff6ff;
            padding: 2px 6px;
            border-radius: 4px;
            height: fit-content;
            flex-shrink: 0;
            cursor: pointer;
            text-decoration: none;
        }
        .time-badge:hover { background: #bfdbfe; }
        .timeline-text {
            color: #334155;
            flex: 1;
        }

        .empty-hint {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- ─── 0. 最左侧总导航栏 ─── -->
    <aside class="global-sidebar">
        <div class="brand">
            <div class="brand-logo">C</div>
            <div class="brand-text">
                <h1>cyberstory</h1>
                <p>知识检索与探索</p>
            </div>
        </div>

        <div class="nav-tabs">
            <div class="nav-tab active">
                <span>📺 YouTube 历史记录</span>
                <span class="badge" id="navBadgeCount">-</span>
            </div>
            <div class="nav-tab disabled" title="后续扩展计划">
                <span>💡 知乎浏览历史</span>
                <span class="badge">即将推出</span>
            </div>
            <div class="nav-tab disabled" title="后续扩展计划">
                <span>📖 微信公众号文章</span>
                <span class="badge">即将推出</span>
            </div>
        </div>

        <div class="service-status">
            <span class="status-dot" id="serviceDot"></span>
            <span id="serviceStatusText">本地服务检测中...</span>
        </div>
    </aside>

    <!-- ─── 主工作区：纵向三列 (A区 | B区 | C区) ─── -->
    <main class="workspace">

        <!-- ─── A区：历史记录列表 (按日期组织 + 状态指示) ─── -->
        <section class="pane-history">
            <div class="pane-header">
                <h2>YouTube 历史流水</h2>
                <span class="header-meta" id="historyMetaCount">加载中...</span>
            </div>

            <div class="history-feed" id="historyFeed">
                <div class="empty-hint">正在读取历史记录...</div>
            </div>
        </section>

        <!-- ─── B区：搜索与结果流 (Search & Highlights) ─── -->
        <section class="pane-search">
            <div class="search-header">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="全局检索视频标题、频道、台词文本... (按 Enter 搜索)">
                </div>
                <div class="search-meta">
                    <span id="searchMetaText">输入关键词检索全文台词</span>
                    <span id="searchCostText"></span>
                </div>
            </div>

            <div class="search-results" id="searchResults">
                <div class="empty-hint">请输入关键词开始检索，或点击左侧历史卡片查看详情</div>
            </div>
        </section>

        <!-- ─── C区：详情与完整台词时间轴列表 (Detail Timeline) ─── -->
        <section class="pane-detail">
            <div class="detail-header">
                <div class="detail-title" id="detailTitle">请选择一个视频</div>
                <div class="detail-meta-bar" id="detailMetaBar">
                    <span>-</span>
                </div>
            </div>

            <div class="sub-filter-box">
                <input type="text" class="sub-filter-input" id="subFilterInput" placeholder="在当前全篇字幕中二次过滤...">
            </div>

            <div class="timeline-stream" id="timelineStream">
                <div class="empty-hint">点击左侧历史记录或搜索结果的【查看字幕】展开时间轴</div>
            </div>
        </section>

    </main>

    <script src="/static/app.js"></script>
</body>
</html>
